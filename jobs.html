<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Careers Vault - INFOMANIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #090d16;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.08);
      --accent-job: #10b981;
      --accent-teal: #14b8a6;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background-image: 
        radial-gradient(circle at 10% 15%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 90% 85%, rgba(20, 184, 166, 0.12) 0%, transparent 45%);
      background-attachment: fixed;
    }

    .wrapper {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 20px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--card-border);
      position: sticky;
      top: 0;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      z-index: 100;
    }

    .brand {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #38bdf8 0%, #a855f7 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-decoration: none;
    }

    .category-group {
      display: flex;
      gap: 12px;
    }

    .cat-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 18px;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 700;
      text-decoration: none;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .cat-btn.home { background: rgba(255, 255, 255, 0.05); }
    .cat-btn.game { background: linear-gradient(135deg, #7c3aed, #6d28d9); }
    .cat-btn.tech { background: linear-gradient(135deg, #0284c7, #0369a1); }
    .cat-btn.job {
      background: linear-gradient(135deg, #059669, #10b981);
      box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4);
      border-color: rgba(52, 211, 153, 0.4);
    }

    .cat-btn:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .adsterra-wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      overflow: hidden;
    }

    .ad-leaderboard {
      width: 100%;
      min-height: 90px;
      margin: 20px 0 10px;
      overflow-x: auto;
    }

    .ad-infeed {
      width: 100%;
      min-height: 90px;
      margin: 12px 0;
      overflow-x: auto;
    }

    .ad-sidebar {
      width: 100%;
      min-height: 600px;
      padding: 10px 0;
    }

    .career-hero {
      margin: 24px 0;
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      min-height: 380px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 40px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: linear-gradient(180deg, rgba(9, 13, 22, 0.2) 0%, rgba(9, 13, 22, 0.95) 100%),
                  url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?w=1400&auto=format&fit=crop&q=80');
      background-size: cover;
      background-position: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
      cursor: pointer;
      transition: transform 0.3s ease;
    }

    .career-hero:hover {
      transform: translateY(-4px);
    }

    .hero-body {
      position: relative;
      z-index: 2;
      max-width: 680px;
    }

    .tag-chip {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 5px 12px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      margin-bottom: 12px;
    }

    .career-hero h2 {
      font-size: 2.1rem;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .career-hero p {
      color: var(--text-muted);
      font-size: 0.98rem;
      line-height: 1.5;
    }

    .layout-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 32px;
      margin-bottom: 40px;
    }

    .vacancies-list {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .vacancy-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 22px;
      cursor: pointer;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      backdrop-filter: blur(10px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .vacancy-card:hover {
      transform: translateY(-3px);
      border-color: rgba(16, 185, 129, 0.4);
      box-shadow: 0 8px 24px rgba(16, 185, 129, 0.1);
    }

    .vacancy-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .role-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .company-name {
      font-size: 0.9rem;
      color: var(--accent-job);
      font-weight: 600;
    }

    .salary-badge {
      font-size: 0.85rem;
      font-weight: 700;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      padding: 5px 12px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .role-snippet {
      color: var(--text-muted);
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .tags-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tech-pill {
      font-size: 0.75rem;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      padding: 3px 10px;
      border-radius: 6px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .sidebar-widget {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
    }

    .sidebar-widget h3 {
      font-size: 1.05rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
      border-bottom: 2px solid var(--accent-job);
      padding-bottom: 8px;
    }

    .sidebar-widget ul {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .sidebar-widget li {
      display: flex;
      gap: 12px;
      align-items: center;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }

    .sidebar-widget li:hover {
      opacity: 0.8;
    }

    .sidebar-widget .num {
      font-size: 1.2rem;
      font-weight: 800;
      color: #334155;
    }

    .sidebar-widget span.text {
      font-size: 0.88rem;
      font-weight: 600;
      line-height: 1.35;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 200;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;
      padding: 30px;
      position: relative;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .close-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: var(--text-main);
      font-size: 1.2rem;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
    }

    .apply-btn {
      display: inline-block;
      background: linear-gradient(135deg, #059669, #10b981);
      color: #ffffff;
      padding: 12px 28px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.95rem;
      text-decoration: none;
      margin-top: 20px;
      cursor: pointer;
      border: none;
    }

    .apply-btn:hover {
      filter: brightness(1.1);
    }

    footer {
      border-top: 1px solid var(--card-border);
      padding: 28px 0;
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    footer a {
      color: var(--text-muted);
      text-decoration: none;
      margin-left: 16px;
    }

    footer a:hover {
      color: #38bdf8;
    }

    @media (max-width: 900px) {
      .layout-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      header {
        flex-direction: column;
        gap: 14px;
        align-items: flex-start;
      }
      .category-group {
        width: 100%;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 6px;
      }
      .cat-btn {
        justify-content: center;
        padding: 8px 4px;
        font-size: 0.75rem;
      }
      .career-hero {
        min-height: 280px;
        padding: 20px;
      }
      .career-hero h2 {
        font-size: 1.35rem;
      }
      .vacancy-header {
        flex-direction: column;
      }
      footer {
        flex-direction: column;
        gap: 12px;
        text-align: center;
      }
      footer a {
        margin: 0 8px;
      }
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <header>
      <a href="index.html" class="brand">INFOMANIA</a>
      <nav class="category-group">
        <a href="index.html" class="cat-btn home">🏠 Home</a>
        <a href="games.html" class="cat-btn game">🎮 Games</a>
        <a href="technology.html" class="cat-btn tech">🚀 Tech</a>
        <a href="jobs.html" class="cat-btn job">💼 Jobs</a>
      </nav>
    </header>

    <!-- Adsterra 728x90 Leaderboard -->
    <div class="adsterra-wrapper ad-leaderboard">
      <script type="text/javascript">
        atOptions = {
          'key' : '26440bed54d9f198e10c7a876eda05cf',
          'format' : 'iframe',
          'height' : 90,
          'width' : 728,
          'params' : {}
        };
      </script>
      <script type="text/javascript" src="https://www.highrevenueformat.com/26440bed54d9f198e10c7a876eda05cf/invoke.js"></script>
    </div>

    <!-- Dynamic Spotlight Hero -->
    <section class="career-hero" id="heroSpotlightContainer">
      <div class="hero-body">
        <span class="tag-chip">Market Spotlight</span>
        <h2 id="heroRoleTitle">Loading Career Spotlight...</h2>
        <p id="heroRoleDesc"></p>
      </div>
    </section>

    <!-- Main Grid: Job Listings + Sidebar -->
    <main class="layout-grid">
      <section class="vacancies-list" id="vacanciesContainer">
        <!-- Rendered dynamically from jobs.json -->
      </section>

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-widget">
          <h3>Hiring Trends</h3>
          <ul id="trendsContainer">
            <!-- Rendered dynamically from jobs.json -->
          </ul>
        </div>

        <!-- Adsterra 160x600 Vertical Banner -->
        <div class="adsterra-wrapper ad-sidebar">
          <script type="text/javascript">
            atOptions = {
              'key' : 'd184a7e889d1a9d742433dfcc5fafef2',
              'format' : 'iframe',
              'height' : 600,
              'width' : 160,
              'params' : {}
            };
          </script>
          <script type="text/javascript" src="https://www.highrevenueformat.com/d184a7e889d1a9d742433dfcc5fafef2/invoke.js"></script>
        </div>
      </aside>
    </main>

    <footer>
      <div>&copy; 2026 INFOMANIA. Curated by Hashiq VK.</div>
      <div>
        <a href="index.html">Home</a>
        <a href="games.html">Games</a>
        <a href="technology.html">Technology</a>
        <a href="mailto:hashiqveekey@gmail.com">Contact</a>
      </div>
    </footer>
  </div>

  <!-- Vacancy Detail Modal -->
  <div class="modal-overlay" id="jobModal" onclick="handleOutside(event)">
    <div class="modal-card">
      <button class="close-btn" onclick="closeJob()">&times;</button>
      <span class="tag-chip" id="mLocation">Remote</span>
      <h2 id="mRole" style="margin: 12px 0 4px;"></h2>
      <div id="mCompany" style="color: var(--accent-job); font-weight: 700; margin-bottom: 8px;"></div>
      <div id="mSalary" style="color: #6ee7b7; font-weight: 700; font-size: 0.95rem; margin-bottom: 16px;"></div>
      <p id="mDesc" style="color: var(--text-muted); line-height: 1.6; font-size: 0.95rem;"></p>
      <button class="apply-btn" onclick="alert('Application submitted for review!')">Apply for this Position</button>
    </div>
  </div>

  <script>
    let jobListings = [];

    async function fetchJobs() {
      try {
        const response = await fetch('jobs.json');
        if (!response.ok) throw new Error('Failed to load jobs.json');
        jobListings = await response.json();
        renderJobs();
      } catch (err) {
        console.error('Error fetching jobs:', err);
      }
    }

    function renderJobs() {
      if (!jobListings.length) return;

      // 1. Render Spotlight Hero
      const spotlight = jobListings.find(j => j.isSpotlight) || jobListings[0];
      document.getElementById('heroRoleTitle').innerText = spotlight.role + ' • ' + spotlight.company;
      document.getElementById('heroRoleDesc').innerText = spotlight.desc;
      document.getElementById('heroSpotlightContainer').onclick = () => openJob(spotlight);

      // 2. Render Vacancies List (with middle in-feed ad)
      const container = document.getElementById('vacanciesContainer');
      container.innerHTML = '';

      jobListings.forEach((job, index) => {
        const card = document.createElement('article');
        card.className = 'vacancy-card';
        card.onclick = () => openJob(job);

        const tagsHtml = (job.tags || []).map(t => `<span class="tech-pill">${t}</span>`).join('');

        card.innerHTML = `
          <div class="vacancy-header">
            <div>
              <div class="role-title">${job.role}</div>
              <div class="company-name">${job.company} • ${job.location}</div>
            </div>
            <div class="salary-badge">${job.badgeSalary || job.salary}</div>
          </div>
          <p class="role-snippet">${job.snippet}</p>
          <div class="tags-container">
            ${tagsHtml}
          </div>
        `;
        container.appendChild(card);

        // Insert in-feed ad after the first listing
        if (index === 0) {
          const adBox = document.createElement('div');
          adBox.className = 'adsterra-wrapper ad-infeed';
          adBox.innerHTML = `
            <iframe srcdoc="<style>body{margin:0;display:flex;justify-content:center;align-items:center;background:transparent;}</style><script type='text/javascript'>atOptions = {'key' : '26440bed54d9f198e10c7a876eda05cf','format' : 'iframe','height' : 90,'width' : 728,'params' : {}};<\\/script><script type='text/javascript' src='https://www.highrevenueformat.com/26440bed54d9f198e10c7a876eda05cf/invoke.js'><\\/script>" width="728" height="90" frameborder="0" scrolling="no"></iframe>
          `;
          container.appendChild(adBox);
        }
      });

      // 3. Render Hiring Trends Sidebar
      const trendsContainer = document.getElementById('trendsContainer');
      trendsContainer.innerHTML = '';
      const trendingJobs = jobListings.filter(j => j.isTrending);

      trendingJobs.forEach((job, index) => {
        const li = document.createElement('li');
        li.onclick = () => openJob(job);
        li.innerHTML = `
          <span class="num">0${index + 1}</span>
          <span class="text">${job.trendTitle || job.role}</span>
        `;
        trendsContainer.appendChild(li);
      });
    }

    function openJob(job) {
      document.getElementById('mRole').innerText = job.role;
      document.getElementById('mCompany').innerText = job.company;
      document.getElementById('mSalary').innerText = job.salary;
      document.getElementById('mLocation').innerText = job.location;
      document.getElementById('mDesc').innerText = job.desc;
      document.getElementById('jobModal').classList.add('active');
    }

    function closeJob() {
      document.getElementById('jobModal').classList.remove('active');
    }

    function handleOutside(e) {
      if (e.target.id === 'jobModal') {
        closeJob();
      }
    }

    window.addEventListener('DOMContentLoaded', fetchJobs);
  </script>
</body>
</html>
